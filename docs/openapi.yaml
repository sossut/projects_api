openapi: 3.1.0
info:
  title: Buildings API
  version: 1.0.0
  description: OpenAPI starter for the Express + TypeScript buildings/projects API.
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Automation
  - name: Enrichment
  - name: Queue Info
  - name: Reference Data
  - name: Companies
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid credentials
  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created
  /users/check-token:
    get:
      tags: [Users]
      summary: Validate the current JWT
      responses:
        '200':
          description: Token is valid
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      summary: Get a user by id
      responses:
        '200':
          description: User record
    put:
      tags: [Users]
      summary: Update a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete a user
      responses:
        '200':
          description: User deleted
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      security: []
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      tags: [Projects]
      summary: Create one or more projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectBatchInput'
      responses:
        '201':
          description: Project(s) created
  /projects/search:
    get:
      tags: [Projects]
      summary: Search projects by text
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results
  /projects/country/{countryId}:
    parameters:
      - $ref: '#/components/parameters/CountryId'
    get:
      tags: [Projects]
      summary: List projects for a country
      responses:
        '200':
          description: Projects for the selected country
  /projects/metro/{metroAreaId}/building-type/{buildingTypeId}:
    parameters:
      - $ref: '#/components/parameters/MetroAreaId'
      - $ref: '#/components/parameters/BuildingTypeId'
    get:
      tags: [Projects]
      summary: List projects by metro area and building type
      responses:
        '200':
          description: Matching projects
  /projects/simple:
    get:
      tags: [Projects]
      summary: Get a compact project list
      responses:
        '200':
          description: Compact project list
  /projects/simple/export:
    get:
      tags: [Projects]
      summary: Export a compact project list
      responses:
        '200':
          description: Export payload
  /projects/simple/export/excel:
    get:
      tags: [Projects]
      summary: Export projects to Excel
      responses:
        '200':
          description: Excel file
  /projects/simple/export/pdf:
    get:
      tags: [Projects]
      summary: Export projects to PDF
      responses:
        '200':
          description: PDF file
  /projects/simple/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      summary: Get a compact project record
      responses:
        '200':
          description: Compact project record
  /projects/favorites:
    get:
      tags: [Projects]
      summary: List favorited projects
      responses:
        '200':
          description: Favorite projects
  /projects/coordinates:
    get:
      tags: [Projects]
      summary: List project coordinates
      responses:
        '200':
          description: Coordinate list
  /projects/count:
    get:
      tags: [Projects]
      summary: Count projects
      responses:
        '200':
          description: Project count
  /projects/statuses:
    get:
      tags: [Projects]
      summary: List distinct project statuses
      responses:
        '200':
          description: Status list
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      summary: Get a project by id
      responses:
        '200':
          description: Full project record
    put:
      tags: [Projects]
      summary: Update a project by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated
    delete:
      tags: [Projects]
      summary: Delete a project
      responses:
        '200':
          description: Project deleted
  /projects/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Projects]
      summary: Favorite a project
      responses:
        '200':
          description: Project favorited
    delete:
      tags: [Projects]
      summary: Unfavorite a project
      responses:
        '200':
          description: Project unfavorited
  /projects/edit:
    put:
      tags: [Projects]
      summary: Update a project by body id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Project updated
  /projects/formatted/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Projects]
      summary: Get a formatted project payload
      responses:
        '200':
          description: Formatted project data
  /automation/job/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Automation]
      summary: Get automation job status
      responses:
        '200':
          description: Job status
  /automation/job/{jobId}/stop:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Automation]
      summary: Stop an automation job
      responses:
        '200':
          description: Job stopped
  /enrichment/job/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Enrichment]
      summary: Get enrichment job status
      responses:
        '200':
          description: Job status
  /enrichment/job/{jobId}/stop:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Enrichment]
      summary: Stop an enrichment job
      responses:
        '200':
          description: Job stopped
  /queue-info:
    get:
      tags: [Queue Info]
      summary: Inspect queue state
      responses:
        '200':
          description: Queue metrics
  /countries:
    get:
      tags: [Reference Data]
      summary: List countries
      security: []
      responses:
        '200':
          description: Countries
  /cities:
    get:
      tags: [Reference Data]
      summary: List cities
      security: []
      responses:
        '200':
          description: Cities
  /metro-areas:
    get:
      tags: [Reference Data]
      summary: List metro areas
      responses:
        '200':
          description: Metro areas
  /building-types:
    get:
      tags: [Reference Data]
      summary: List building types
      responses:
        '200':
          description: Building types
  /building-uses:
    get:
      tags: [Reference Data]
      summary: List building uses
      responses:
        '200':
          description: Building uses
  /architects:
    get:
      tags: [Reference Data]
      summary: List architects
      responses:
        '200':
          description: Architects
  /companies:
    get:
      tags: [Companies]
      summary: List companies
      responses:
        '200':
          description: Companies
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
    JobId:
      in: path
      name: jobId
      required: true
      schema:
        type: string
    CountryId:
      in: path
      name: countryId
      required: true
      schema:
        type: integer
        minimum: 1
    MetroAreaId:
      in: path
      name: metroAreaId
      required: true
      schema:
        type: integer
        minimum: 1
    BuildingTypeId:
      in: path
      name: buildingTypeId
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
        id:
          type: integer
        ids:
          type: array
          items:
            type: integer
        jobId:
          type: string
        jobIds:
          type: array
          items:
            type: string
      required:
        - message
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    UserInput:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [admin, user]
    UserListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserInput'
    ProjectBatchInput:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectInput'
    ProjectInput:
      type: object
      required:
        - name
        - buildingType
        - buildingUse
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        buildingType:
          type: string
        buildingUse:
          type: array
          items:
            type: string
        buildingHeightMeters:
          type: number
          minimum: 0
        buildingHeightFloors:
          type: integer
          minimum: 0
        budgetEur:
          type: number
          minimum: 0
        status:
          type: string
          enum:
            - planned
            - approved
            - proposed
            - on_hold
            - under_construction
            - completed
            - cancelled
            - pre_construction
    ProjectListResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectInput'
